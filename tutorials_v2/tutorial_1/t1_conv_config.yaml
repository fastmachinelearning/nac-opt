# Tutorial 1-v2 BONUS: Block search on MNIST — Conv / ConvAttn / MLP / None
# ==========================================================================
# Surrogate OFF (use_hardware_metrics: false) because rule4ml only supports
# ReLU/Softmax/linear activations and auto-flattens models; Conv/ConvAttn
# architectures require the full spatial structure so hardware metrics are
# disabled for this search.  Tradeoff: we explore the full modern block space
# but optimise accuracy alone, with no FPGA cost signal in the loop.

dataset:
  name: mnist
  resize_val: 16
  subset_size: 5000
  flatten: false
  one_hot: true

search:
  model_type: block
  n_trials: 5
  epochs: 3
  n_folds: 2
  use_hardware_metrics: false
  objective_names: [performance_metric, bops]
  maximize_flags: [true, false]

search_space:
  channel_space: [4, 8, 16]
  mlp_width_space: [16, 32, 64]
  kernel_space: [1, 3]
  act_space: [ReLU, GELU, LeakyRelu]
  norm_space: [null, batch]
  block_types: [Conv, ConvAttn, MLP, None]
  num_blocks: 4
  initial_img_size: 16
  output_dim: 10
  output_activation: softmax
  conv_attn:
    hidden_channel_space: [4, 8]

hls_config:
  board: zcu102
  model:
    precision: "ap_fixed<8,3>"
    reuse_factor: 1
    strategy: Latency

local_search:
  qat_epochs: 3
  pruning_iterations: 3
  pruning_epochs: 3
  pruning_rate: 0.7
  precision_pairs:
    - {total_bits: 8, int_bits: 3}
    - {total_bits: 4, int_bits: 1}

output:
  results_dir: ./results/tutorial1_conv
