# Tutorial 2-v2: Qubit readout search — from search to silicon
# =============================================================
# Same four-objective hardware-aware search as Tutorial 1, now on a real
# physics dataset: superconducting qubit IQ readout (2-class classification).
# Hardware metrics ON, block search (MLP/None), combined QAT+pruning, hls4ml.
#
# NOTE: rule4ml needs the conda library path at runtime:
#   export LD_LIBRARY_PATH="$CONDA_PREFIX/lib:${LD_LIBRARY_PATH:-}"
#
# Multi-node search (SLURM): see tutorials/tutorial_3_qubit/run_global_search.py

dataset:
  name: qubit
  data_dir: ../../data/qubit/
  start_location: 100
  window_size: 400
  subset_size: 1000
  normalize: true
  flatten: true
  one_hot: true
  num_classes: 2

search:
  model_type: block
  n_trials: 2
  epochs: 10
  n_folds: 3
  use_hardware_metrics: true
  objective_names: [performance_metric, bops, avg_resource, clock_cycles]
  maximize_flags: [true, false, false, false]

search_space:
  mlp_width_space: [16, 32, 64, 128]
  act_space: [ReLU, LeakyReLU]
  norm_space: [batch, null]
  block_types: [MLP, None]
  num_blocks: 4
  output_dim: 2
  output_activation: softmax
  # Required dummy keys (unused — no Conv/ConvAttn in block_types):
  channel_space: [16, 32]
  kernel_space: [3]
  conv_attn:
    hidden_channel_space: [4]

hls_config:
  board: zcu102
  model:
    precision: "ap_fixed<8,3>"
    reuse_factor: 8   # 1 = min latency but can trigger "excessive memory" in Vivado; use 8+ if synthesis fails
    strategy: Latency

synthesis:
  total_bits: 8
  int_bits: 3
  hls_output_dir: ./results/tutorial2_qubit/hls_project

local_search:
  qat_epochs: 10
  pruning_iterations: 8
  pruning_epochs: 10
  pruning_rate: 0.60
  precision_pairs:
    - {total_bits: 16, int_bits: 6}
    - {total_bits: 8,  int_bits: 3}
    - {total_bits: 6,  int_bits: 2}

output:
  results_dir: ./results/tutorial2_qubit
